# The sweep the blob file defaults are chosen from: block target, chunk size
# and the size classes a zstd dictionary applies to, measured on the data of
# the products that store values in blob files. Standalone like the other
# tools, so the main crate's builds do not compile it. The data is fetched once
# by `fetch-data.ts` into a directory outside the repository:
#
#     node tools/blob-sweep/fetch-data.ts ~/blob-sweep-data
#     cd tools/blob-sweep && cargo run --release -- --data ~/blob-sweep-data
#
# The empty `[workspace]` keeps Cargo from taking this crate into a workspace
# above it, as in the other tool crates.
[workspace]

[package]
name = "blob-sweep"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
lsm-tree = { package = "coordinode-lsm-tree", path = "../..", features = ["lz4", "zstd", "metrics"] }
# Trains the dictionaries the dictionary rows compress with.
structured-zstd = { version = "0.2.6", features = ["dict-builder"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
