# Standalone benchmark tool — not part of the main coordinode-lsm-tree crate.
# Build with: cd tools/db_bench && cargo build --release
#
# The empty `[workspace]` pins this crate as its own root so a standalone build
# is never absorbed into a workspace manifest higher up the tree (the main crate
# excludes it, but exclusion alone does not stop a DIFFERENT parent workspace,
# e.g. a stray one in a CI runner's temp dir, from claiming it).
[workspace]

[package]
name = "db-bench"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "db_bench"
path = "src/main.rs"

[features]
flamegraph = ["dep:tracing", "dep:tracing-subscriber", "dep:tracing-flame"]

[dependencies]
# `metrics` is not optional here: the mixed-layout workload reports the
# read-path byte counters, and without the feature they do not exist. Every
# other workload reports rates and is unaffected by it being on.
lsm-tree = { package = "coordinode-lsm-tree", path = "../..", features = [
    "lz4",
    "zstd",
    "metrics",
] }
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tracing = { version = "0.1", optional = true }
tracing-flame = { version = "0.2", optional = true }
tracing-subscriber = { version = "0.3", features = ["registry"], optional = true }

# Deterministic code layout for the dashboard binary: default codegen (16
# units, no LTO) reshuffles function placement on ANY code change, stepping
# the published trend by several percent on commits that never touch the
# measured path. See the same section in the crate root Cargo.toml.
[profile.release]
lto = "thin"
codegen-units = 1

# The same dev profiles as the crate root: this is a separate workspace and
# does not inherit them. See the root Cargo.toml for what each one is for.
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
debug = "line-tables-only"

[profile.debugger]
inherits = "dev"
debug = "full"

# Here "*" also covers the engine, which is a dependency of this workspace
# rather than a member, so a dev build measures an optimised engine.
[profile.dev.package."*"]
opt-level = 2

# The engine is a path dependency here, which Cargo builds incrementally, and a
# compiler cache never serves incremental artifacts: every fresh target
# directory would recompile it. Non-incremental makes it cacheable.
[profile.dev.package.coordinode-lsm-tree]
incremental = false
