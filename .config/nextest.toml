[store]
dir = "target/nextest"

# Slow-timeout audit (last measured against perf/#158-ci-optim,
# all-features, `--profile ci`, on a 10-core M3 Pro, proptests
# excluded). Most tests stay under the 10s default-profile threshold;
# the slowest light tests land between 4.3s and 8.9s, all well under
# `terminate-after = 6` (60s wall). Top of that distribution:
#
#   8.91s  tree_bulk_ingest::blob_tree_copy
#   7.48s  compaction::leveled::test::dynamic_leveling_multiple_levels
#   6.79s  compaction::leveled::test::leveled_sequential_inserts
#   6.00s  compaction::leveled::test::multi_level_with_both_flags
#   5.75s  compaction::leveled::test::multi_level_data_integrity
#   5.38s  tree_bulk_ingest::blob_tree_bulk_ingest
#   5.34s  blob_fifo_limit::blob_tree_fifo_limit
#   5.11s  tree_bulk_ingest::tree_copy
#   4.69s  model_6
#   4.30s  compaction::leveled::test::multi_level_sparse_keyspace_data_integrity
#
# If a NEW test starts exceeding 10s, first optimise it (smaller input,
# fewer iterations): the 10s ceiling exists to catch accidental setup
# regressions. A handful of inherently-heavy correctness tests exceed it
# by design over real large-input I/O (partial-decode resume across
# decoders, lazy-block, ECC heal, large-zstd block round-trip, the full
# compatibility matrix); those get a wider window via the dedicated
# override below, so the global 10s ceiling stays meaningful for every
# other test instead of being relaxed wholesale.
[profile.default]
slow-timeout = { period = "10s", terminate-after = 6 }
fail-fast = true

# Property tests default to 32 cases via the shared
# `common::proptest_config()` helper (PROPTEST_CASES /
# PROPTEST_MAX_SHRINK env vars override at run time). Budget:
# 30s × 4 = 120s — enough for 32 cases with I/O, generous for
# CI's higher-variance runners.
[[profile.default.overrides]]
filter = "test(prop_)"
slow-timeout = { period = "30s", terminate-after = 4 }

# Inherently-heavy correctness tests: real large-input I/O (large-zstd
# block round-trips, partial-decode resume across decoders, lazy-block
# extent growth, ECC heal, the full feature compatibility matrix), not
# setup-regression-prone. They legitimately cross the 10s default ceiling,
# so they get the same 30s window as proptests; every other test keeps the
# 10s ceiling (see the audit note above).
[[profile.default.overrides]]
filter = "test(partial_decode_) | test(lazy_block) | test(ecc_heal_scheduled) | test(block_layout_section_roundtrips_for_large_zstd) | test(compatibility_matrix_round_trips)"
slow-timeout = { period = "30s", terminate-after = 4 }

# Wall-clock concurrency stress: 4 writers + 2 readers contend on one
# encrypted tree for a fixed 2-second window, then exact-equality
# assertions run over the committed tally. The test's correctness envelope
# assumes its threads actually get CPU / disk / fds during that window;
# co-scheduled with the rest of the suite it can starve and flake on
# resource pressure that has nothing to do with encryption. Claim every
# scheduler slot so it runs ALONE — the assertions stay at full strength
# (a real engine race still fires solo), only cross-test contention is
# removed. Mirrored in the ci profile below.
[[profile.default.overrides]]
filter = "test(concurrent_encrypted_no_corruption)"
threads-required = "num-cpus"

# The single-byte-bitrot heal fuzzer runs for a fixed ~45s wall-clock budget
# (`#[ignore]`d, so it only runs under `--run-ignored`), well past the 10s
# ceiling by design. Give it a generous window so a slower runner's corpus
# build does not push it into a spurious termination.
[[profile.default.overrides]]
filter = "test(fuzz_heal_bitrot)"
slow-timeout = { period = "90s", terminate-after = 2 }

# CI profile: retries for flaky tests, JUnit XML output, longer timeouts.
[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 3 }
status-level = "all"
final-status-level = "flaky"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[[profile.ci.overrides]]
filter = "test(prop_)"
slow-timeout = { period = "120s", terminate-after = 4 }

# See the default-profile override of the same filter: the wall-clock
# stress test claims the whole scheduler so cross-test contention cannot
# starve its 2-second window.
[[profile.ci.overrides]]
filter = "test(concurrent_encrypted_no_corruption)"
threads-required = "num-cpus"

# The bitrot heal fuzzer's fixed ~45s budget (see the default-profile note); a
# generous timeout keeps it from a spurious termination on a slow CI runner.
[[profile.ci.overrides]]
filter = "test(fuzz_heal_bitrot)"
slow-timeout = { period = "90s", terminate-after = 2 }
