name: Set up mold
description: Installs the mold linker on a Linux runner, which the x86_64 Linux build links through (.cargo/cc-mold.sh); a no-op elsewhere.
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      # The image's package index is used first; a stale one is refreshed.
      # mold only saves disk writes: .cargo/cc-mold.sh links with cc where it
      # is not installed, so a package mirror the runner cannot reach leaves
      # the build linking as rustc otherwise would instead of failing it.
      run: |
        if sudo apt-get install -y --no-install-recommends mold \
          || { sudo apt-get update && sudo apt-get install -y --no-install-recommends mold; }; then
          mold --version
        else
          echo "::warning title=mold unavailable::the package mirror did not answer; linking with cc"
        fi
