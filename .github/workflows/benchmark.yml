# Hardening policy: every `uses:` ref is pinned to a full commit
# SHA; `actions/checkout` runs with `persist-credentials: false`
# (this workflow does not push from the default identity — gh-pages
# results use the App-token-scoped benchmark-action input);
# `actions/create-github-app-token` lists explicit `permission-*`
# scopes for the minimum the workflow actually exercises.
name: Benchmark

on:
  # Auto-triggered ONLY on merges/pushes to main; also runnable
  # manually from any branch via workflow_dispatch (see below).
  # `pull_request` is deliberately omitted: the self-hosted bench
  # host is shared with future cross-engine benches (issue #244)
  # and other perf workloads — every PR pushing a commit would
  # queue behind the host's serial concurrency group and hold up
  # every subsequent PR, even when the change can't affect the
  # bench (CI, docs, comment-only fixes). Restricting the
  # AUTO-trigger to main keeps the bench timeline a clean "one
  # entry per merged change" series, which is what the gh-pages
  # dashboard is meant to show. Manual runs through
  # workflow_dispatch don't update the dashboard's main-branch
  # series (auto-push gating below is push+main only), so they
  # can't contaminate the trend.
  push:
    branches: [main]
  # Manual dispatch from any branch when a contributor explicitly
  # wants to measure their PR against main before merging.
  # workflow_dispatch requires actions:write on the repo, so only
  # owner / maintainers can fire it — fork PR authors cannot.
  workflow_dispatch:

# Strict serialisation across the entire repo: the self-hosted
# bench host is shared with future cross-engine benches (RocksDB
# vs lsm-tree per issue #244) and any other perf workload. Two
# benches running simultaneously contaminate each other's CPU /
# disk / cache state and the published numbers become unreadable.
# `cancel-in-progress: false` makes queued runs wait their turn
# instead of clobbering the in-flight bench — every measurement
# completes on a quiet host.
concurrency:
  group: bench-self-hosted
  cancel-in-progress: false

# The workflow token only reads the repository for checkout: every write
# (gh-pages, alert comments) goes through the App token generated per job.
permissions:
  contents: read

jobs:
  # Keeps the dashboard data consistent before the bench stores anything: the
  # suites were once named without a version line, so 5.x and 6.0 points
  # shared one chart and one alert baseline, and the first step moves every
  # point of an unversioned suite into the suite of its line, once: 6.x from
  # the first commit of the 6.0 line, 5.x before it. The second drops the
  # points of retired series. Either changes nothing once done. On a hosted
  # runner, since the transforms need jq and the full history of main.
  split-series:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          # Pushes the rewritten data file to gh-pages; nothing else.
          permission-contents: write

      - name: Split unversioned suites by version line
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          push_gh_pages="$PWD/.github/scripts/push-gh-pages.sh"
          work="$(mktemp -d "${TMPDIR:-/tmp}/split-ghpages.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # The token reaches git through a credential helper reading the
          # environment, never argv or .git/config (see the compare publish
          # step of the benchmark job for the reasoning).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          # shellcheck disable=SC2016
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git clone --depth 1 --branch gh-pages \
            "https://github.com/${REPO}.git" "$work"
          # 8b03201bb opens the 6.0 line: the first breaking commit on main
          # after the last 5.x release.
          status=0
          bash .github/scripts/split-bench-series.sh "$work/dev/bench/data.js" \
            8b03201bb82fab1bf486819a0f0a54d460583fed 5 6 || status=$?
          case "$status" in
            0) ;;
            3) echo "::notice::no unversioned suite left, nothing to split"; exit 0 ;;
            *) exit "$status" ;;
          esac
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/bench/data.js
          git commit -m "bench: split the dashboard suites by version line (dev/bench)"
          bash "$push_gh_pages"

      # A series whose meaning changed gets a new name, and one that moves to
      # another suite leaves the old one; the points recorded under the old
      # name or in the old suite measure something else, so they go
      # (.github/bench/retired-series.json says which and why). With none left
      # it changes nothing.
      - name: Drop retired series
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          push_gh_pages="$PWD/.github/scripts/push-gh-pages.sh"
          work="$(mktemp -d "${TMPDIR:-/tmp}/retire-ghpages.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          # shellcheck disable=SC2016
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git clone --depth 1 --branch gh-pages \
            "https://github.com/${REPO}.git" "$work"
          status=0
          bash .github/scripts/drop-retired-series.sh "$work/dev/bench/data.js" \
            .github/bench/retired-series.json || status=$?
          case "$status" in
            0) ;;
            3) echo "::notice::no retired series left, nothing to drop"; exit 0 ;;
            *) exit "$status" ;;
          esac
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/bench/data.js
          git commit -m "bench: drop the points of retired series (dev/bench)"
          bash "$push_gh_pages"

  benchmark:
    # After the split, so the first store of a push lands in a data file that
    # already has its versioned suites; a dispatch skips the split and runs.
    needs: split-series
    # Runs only in this repository and never on the code of a pull request
    # from a fork: a self-hosted runner executes whatever the job checks out.
    if: >
      !cancelled() &&
      (needs.split-series.result == 'success' || needs.split-series.result == 'skipped') &&
      github.repository_owner == 'structured-world' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Two passes in one job: (1) the single-engine db_bench trend (regression
    # guard + dev/bench dashboard) and (2) the RocksDB head-to-head compare
    # (public dev/compare overlay dashboard). The name reflects both so it does
    # not read as a lightweight gate — it is the full public benchmark suite,
    # and it builds RocksDB from C++ source, so it is minutes, not seconds.
    name: db_bench trend + RocksDB head-to-head
    # Self-hosted bare-metal runner. Shared GitHub-hosted runners
    # have ±15-20% noise on every db_bench workload — large enough
    # to hide every win below ~20% and produce false-positive
    # regression alerts. The self-hosted host has stable thermal
    # state, no CPU contention from other jobs, and consistent
    # disk I/O — bench delta becomes interpretable per merged
    # commit on main instead of needing 20+ iteration medians to
    # escape the noise floor. (Per-PR comparison is available via
    # the `workflow_dispatch` manual trigger above; routine PR
    # pushes do not auto-queue against this runner.)
    #
    # Targeted by GROUP, not by a per-host label: the bench box is one
    # physical machine that boots either Linux or Windows, and each boot
    # registers its own runner with its own labels. A label pinned to one of
    # them leaves the bench queued for as long as the box happens to be
    # running the other OS. The group holds both registrations, so the job
    # lands on whichever is up. `labels: [self-hosted]` keeps it off
    # GitHub-hosted runners if any are ever added to the group.
    runs-on:
      group: Default
      labels: [self-hosted]
    # The whole job, every bench in it, fits in 30 minutes on a warm cache:
    # the three builds side by side, the db_bench pass, the head-to-head
    # matrix and the publishing. Each bench step has its own limit below, so
    # an overrun fails at the bench that caused it.
    #
    # On a cold cache the librocksdb-sys C++ compile (RocksDB built from
    # source via bindgen) takes 15-25 min by itself, which leaves too little
    # of the budget for the benches, so that run fails at its limit. The
    # build is saved to the cache as soon as it finishes, before any bench,
    # so the next run is warm again whatever happens to this one.
    timeout-minutes: 30
    defaults:
      run:
        # Every step below is written in POSIX shell. Windows would otherwise
        # hand them to PowerShell, where none of it parses; `bash` resolves to
        # the Git for Windows shell that ships with the runner's git.
        shell: bash
    steps:
      # v6 requires runner ≥2.327.1 (node24 runtime) — the self-hosted
      # runner has a current runner agent that satisfies this.
      # persist-credentials: false — git pushes from this workflow use the
      # explicit App token generated below, NOT the runner's GITHUB_TOKEN
      # written to .git/config. Disabling the default credential persistence
      # closes the credential-persistence attack surface (zizmor's
      # `artipacked` lint — ARTIfact-PACKED, the documented class of
      # token leakage where actions/upload-artifact captures the
      # whole working tree, including the .git/config that the
      # default checkout populated with GITHUB_TOKEN).
      # Pinning policy: first-party actions (actions/*, dependabot/*) track a
      # MAJOR tag; third-party actions stay pinned to a commit digest with a
      # version comment. See coordinode-release.yml for the reasoning.
      # Full history and tags: the version line of the measured commit is the
      # next version release-plz computes for it, from the commits since the
      # last release tag.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      # Each major version line has its own suites, so a 6.0 commit is never
      # judged against a 5.x baseline. The line is the major of the next
      # version release-plz computes for the measured commit, not the version
      # in Cargo.toml: that one moves only when the release PR merges, so it
      # names the previous line from the first breaking commit until the
      # release. release-plz reads the same conventional-commit markers the
      # release does, so the dashboard and the release agree on every commit.
      # Installed the way the release workflow's release-plz action installs
      # it (prebuilt binary through cargo-binstall), at the version that action
      # runs, so both compute the same next version.
      - uses: cargo-bins/cargo-binstall@b874e25ea559687bec77e281e9b271aa1367b624  # v1.23.0
        env:
          BINSTALL_VERSION: 1.23.0

      # The self-hosted runner keeps CARGO_HOME between runs, and binstall
      # trusts its install record there: a record whose binary is gone reports
      # "already installed" and installs nothing. The binary that runs decides,
      # so a missing or other version is installed over the record.
      - name: Install release-plz
        run: |
          set -euo pipefail
          want="release-plz 0.3.169"
          have="$(release-plz --version 2>/dev/null || true)"
          if [ "$have" != "$want" ]; then
            cargo binstall release-plz@0.3.169 --strategies crate-meta-data,compile --no-confirm --force
          fi
          have="$(release-plz --version 2>/dev/null || true)"
          if [ "$have" != "$want" ]; then
            echo "::error::release-plz is not runnable after the install (got '$have')"
            exit 1
          fi

      - name: Version line of the measured commit
        id: line
        run: |
          set -euo pipefail
          # release-plz compares the branch against its upstream, so it needs
          # the branch the checkout created, not a detached HEAD.
          if [ -z "$(git branch --show-current)" ]; then
            echo "::error::the checkout is a detached HEAD; release-plz computes the next version only on a branch"
            exit 1
          fi
          release-plz update --no-changelog --config .release-plz.toml
          id="$(cargo pkgid)"
          # The version follows the last `#` or `@`: cargo spells the id
          # `<url>#<name>@<version>`, or `<url>#<version>` when the package is
          # named as its directory is, as on the bench runner.
          version="${id##*[#@]}"
          # The update rewrites the manifest's version; the measured tree is
          # the commit as it is.
          git restore --source=HEAD --worktree -- Cargo.toml
          major="${version%%.*}"
          case "$major" in
            '' | *[!0-9]*)
              echo "::error::cannot read a major version from '$id'"
              exit 1
              ;;
          esac
          echo "Measured commit ships as $version: suites of the $major.x line"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The checkout above runs `git clean -ffdx`, which removes every ignored
      # `target/` in the workspace, so nothing built survives on the runner
      # from one run to the next. The one build worth carrying over is
      # tools/compare-rocksdb's, which compiles RocksDB from C++ source
      # (15-25 minutes): its target is restored here and saved by the step
      # right after the build (CARGO_HOME already persists on the self-hosted
      # runner). The engine and db_bench build in minutes and are removed by
      # the last step instead. The key moves with the harness manifest and the
      # toolchain; the prefix restores the nearest older build, whose compiled
      # RocksDB cargo reuses when its version did not change.
      - name: Restore the compare-rocksdb build
        id: compare-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            tools/compare-rocksdb/target
            !tools/compare-rocksdb/target/head-to-head
          key: compare-rocksdb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/compare-rocksdb/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: compare-rocksdb-${{ runner.os }}-${{ runner.arch }}-

      # librocksdb-sys builds C bindings via bindgen -> clang-sys, which needs
      # libclang on the host. When it is absent the raw failure is a deep,
      # cryptic clang-sys build-script panic, so fail early with an actionable
      # message naming what to install on the self-hosted runner instead. On
      # Linux bindgen finds the distro libclang.so without env-var help; on
      # Windows it loads libclang.dll, which has no standard search path, so
      # the step also exports LIBCLANG_PATH when it locates an LLVM install.
      # Its failure fails the head-to-head step, not this one, so a host that
      # cannot build RocksDB still measures and publishes the db_bench trend.
      - name: Verify libclang toolchain (compare-rocksdb prerequisite)
        id: libclang
        continue-on-error: true
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # bindgen needs libclang.dll. An explicit LIBCLANG_PATH wins;
            # otherwise probe the default LLVM install locations and export
            # what we find, since nothing on Windows searches for it.
            if [ -n "${LIBCLANG_PATH:-}" ]; then
              exit 0
            fi
            # Probed through the shell's own path form, but EXPORTED as a
            # native path: everything downstream (the linker's DLL search,
            # clang-sys) is a Windows process, and a `/c/...` string means
            # nothing to it.
            for dir in "/c/Program Files/LLVM/bin" "/c/Program Files (x86)/LLVM/bin"; do
              if [ -f "$dir/libclang.dll" ]; then
                native="$(cd "$dir" && pwd -W)"
                echo "LIBCLANG_PATH=$native" >> "$GITHUB_ENV"
                # LIBCLANG_PATH only tells clang-sys where to look. The build
                # script links against libclang, so Windows resolves the DLL
                # itself at process start and searches PATH: without this the
                # script dies as STATUS_DLL_NOT_FOUND before running a line.
                echo "$native" >> "$GITHUB_PATH"
                echo "libclang: $native"
                exit 0
              fi
            done
            echo "::error::libclang.dll not found on the bench runner. compare-rocksdb (librocksdb-sys -> bindgen -> clang-sys) cannot build. Install LLVM on the runner host ('winget install LLVM.LLVM' or 'choco install llvm'), or set LIBCLANG_PATH to the directory holding libclang.dll."
            exit 1
          fi

          # Linux detection covers: llvm-config on PATH (Fedora/most), explicit
          # LIBCLANG_PATH, direct lib dirs (/usr/lib64 on Fedora), Debian/Ubuntu
          # multiarch (/usr/lib/x86_64-linux-gnu) + llvm-* dirs via the nested
          # glob, and finally ldconfig -p (the robust Linux probe that finds
          # libclang wherever the dynamic linker registered it).
          if ! command -v llvm-config >/dev/null 2>&1 \
             && [ -z "${LLVM_CONFIG_PATH:-}" ] \
             && [ -z "${LIBCLANG_PATH:-}" ] \
             && ! ls /usr/lib*/libclang.so* /usr/lib*/*/libclang.so* >/dev/null 2>&1 \
             && ! { command -v ldconfig >/dev/null 2>&1 && ldconfig -p | grep -q libclang; }; then
            echo "::error::libclang/llvm-config not found on the bench runner. compare-rocksdb (librocksdb-sys -> bindgen -> clang-sys) cannot build. Install LLVM dev tools on the runner host: Fedora 'dnf install -y clang clang-devel llvm llvm-devel', Debian/Ubuntu 'apt-get install -y clang libclang-dev llvm-dev', or set LIBCLANG_PATH/LLVM_CONFIG_PATH."
            exit 1
          fi

      # Every binary the benches below run, built side by side before any of
      # them measures: one after another the three builds take ~9 min of the
      # 30. Bounded by the job's limit only, since a cold RocksDB compile (see
      # the cache step) is the one build that cannot fit.
      #
      # A failed build fails the step that runs its binary, not this one: each
      # bench step runs through cargo, which builds again what is missing and
      # stops on the same error there. So a host that cannot build RocksDB
      # still measures and publishes the db_bench trend, and the head-to-head
      # step fails the job.
      - name: Build the benchmark binaries
        id: build
        continue-on-error: true
        run: bash .github/scripts/build-benchmarks.sh

      # Saved as soon as it is built, before any bench runs: a cold RocksDB
      # compile takes most of the job's budget, and a save left to the end of
      # the job would be lost whenever the benches after it overrun. Only on a
      # miss of the exact key, since a cache entry cannot be overwritten.
      - name: Save the compare-rocksdb build
        if: >
          !cancelled() &&
          steps.build.outcome == 'success' &&
          steps.compare-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            tools/compare-rocksdb/target
            !tools/compare-rocksdb/target/head-to-head
          key: ${{ steps.compare-cache.outputs.cache-primary-key }}

      # The db_bench pass: under a minute on an idle host, ~3 min on a loaded
      # one.
      - name: Run benchmarks
        id: dbbench
        timeout-minutes: 6
        run: bash .github/scripts/run-benchmarks.sh 200000

      # Head-to-head RocksDB comparison. Distinct from the db_bench
      # trend above (single-engine, value-over-commits): this runs the
      # standalone `tools/compare-rocksdb` harness, where every scenario runs
      # every engine in the same process and the same rounds, one sample each
      # per round, so a burst of other load on a shared host slows every
      # engine of the rounds it overlaps and divides out of their ratio.
      # Because the comparison is a ratio measured on one host in one run, it
      # stays meaningful even if this runner's CPU changes between runs.
      #
      # It runs straight after the db_bench pass, before any step below
      # switches the checkout to gh-pages and back: that rewrites the
      # engine's sources, and cargo would then rebuild the harness the build
      # step already compiled.
      #
      # The harness's own defaults set the rounds (a per-group budget, ten at
      # least), so the published run and a local `cargo bench` measure alike.
      - name: Run compare-rocksdb head-to-head benches
        id: compare
        # Runs whatever the db_bench pass did, so a host that cannot build
        # RocksDB still reaches the db_bench publishing below.
        if: ${{ !cancelled() }}
        # ~4 min on an idle host; the limit leaves room for a loaded one.
        timeout-minutes: 15
        # Pin the published dashboard to the RocksDbParity preset (the apples-to-
        # apples comparison): every lsm-tree-only on-disk opt-in is OFF so the
        # numbers are not paying for protection RocksDB has no equivalent for.
        # Set explicitly rather than relying on the in-code default, so a future
        # default change cannot silently alter the public comparison. See
        # docs/BENCHMARKING.md.
        env:
          LSM_BENCH_PRESET: rocksdb-parity
          LIBCLANG_OUTCOME: ${{ steps.libclang.outcome }}
        # A summary an earlier run on this runner left behind goes first, so a
        # run that fails before writing its own cannot publish the old one.
        run: |
          if [ "$LIBCLANG_OUTCOME" != success ]; then
            echo "::error::compare-rocksdb cannot build without libclang; see the 'Verify libclang toolchain' step"
            exit 1
          fi
          cd tools/compare-rocksdb
          rm -rf target/head-to-head
          cargo bench --bench compare

      # Issued after the benches, right before its first use: an installation
      # token lives one hour, so one issued at the start of the job would let
      # the job's length decide whether its results publish. Every publishing
      # step below runs within a minute of it.
      #
      # The db_bench publishing depends on the db_bench pass only: when the
      # head-to-head fails (a host that cannot build RocksDB) the db_bench
      # trend still publishes and the head-to-head step fails the job.
      - name: Generate bot token
        id: bot-token
        # `push` and `workflow_dispatch` are both trusted contexts on
        # this repo (workflow_dispatch requires actions:write, which
        # only owner/maintainers hold; fork PRs can't trigger it).
        # The `pull_request` clause exists for paranoia: if the
        # trigger list is ever expanded to include `pull_request`,
        # only same-repo PRs get the token (fork PRs would still be
        # blocked). On `workflow_dispatch` the `github.event.pull_request`
        # context is absent, so the `pull_request` branch is gated by
        # `github.event_name == 'pull_request'` to avoid evaluating
        # a missing context.
        if: >
          !cancelled() &&
          (
            github.event_name == 'push' ||
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' &&
             github.event.pull_request.head.repo.full_name == github.repository)
          )
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          # Least-privilege scope: benchmark-action/github-action-benchmark
          # needs contents:write (push results to gh-pages branch on main),
          # pull-requests:write (comment on PRs with comparison alerts).
          # No other scopes are exercised by this workflow.
          permission-contents: write
          permission-pull-requests: write

      # The bench runner is self-hosted, so its workspace survives between runs
      # (a GitHub-hosted runner starts each job on an empty disk, which is why
      # this is not needed there). The step below fetches `gh-pages:gh-pages`,
      # and on a run that does NOT auto-push (every manual dispatch) it commits
      # to that local branch and leaves the commit behind. The next run's fetch
      # then reports non-fast-forward against its own leftover and fails before
      # measuring anything. Drop the local branch first: the step recreates it
      # from the remote, so nothing that was actually published is lost.
      - name: Drop a local gh-pages left by an earlier run
        if: ${{ !cancelled() && steps.dbbench.outcome == 'success' && steps.bot-token.outputs.token != '' }}
        run: git branch --delete --force gh-pages 2>/dev/null || true

      # One series per version line and host: the job lands on whichever
      # registered runner is up (the bench box under Windows or Linux, or the
      # CI host), and a rate measured on one machine is no baseline for
      # another. Keyed by the runner's name as well as its OS, since two hosts
      # can share an OS. A manual dispatch is compared against the suite of the
      # line it measures. The overlay page published below draws every host's
      # series of one line on one chart.
      - name: Store benchmark results
        if: ${{ !cancelled() && steps.dbbench.outcome == 'success' && steps.bot-token.outputs.token != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: "lsm-tree db_bench ${{ steps.line.outputs.major }}.x · ${{ runner.os }} · ${{ runner.name }}"
          tool: customBiggerIsBetter
          output-file-path: benchmark-results.json
          github-token: ${{ steps.bot-token.outputs.token }}
          # The commit the point is filed under. A push carries it in the
          # event; on a dispatch the action otherwise resolves the branch name
          # through the API, which names the branch's head at the time of the
          # store, not the commit measured, and has failed outright on a
          # branch named with `#` ("No commit found for SHA").
          ref: ${{ github.sha }}
          # The dashboard series is the history of main, so only a push to
          # main extends it. A manual dispatch measures a branch and is
          # compared against that series without joining it.
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          # Comment the comparison on the commit that regressed.
          comment-on-alert: true
          alert-comment-cc-users: "@polaz"
          # A run 15% below the series is flagged. Advisory, not a gate:
          # neither trigger sits on the merge path. The push runs on main
          # once the change has landed, so failing it reddens main after the
          # fact without stopping anything; the dispatch is opt-in and
          # maintainer-only, so no PR is required to have one and failing it
          # would turn a voluntary measurement into a red X. Gating would
          # need a bench every PR must pass, which is what the serialised
          # bench host rules out. fail-threshold is deliberately unset -- it
          # would be dead config while nothing fails the job.
          alert-threshold: "115%"
          fail-on-alert: false
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          benchmark-data-dir-path: dev/bench

      # The step above leaves a local gh-pages commit on a run that does not
      # auto-push, and the next store step fetches gh-pages:gh-pages; drop it
      # again for the same reason as before the first store.
      - name: Drop the local gh-pages the rate store left
        if: ${{ !cancelled() && steps.dbbench.outcome == 'success' && steps.bot-token.outputs.token != '' }}
        run: git branch --delete --force gh-pages 2>/dev/null || true

      # Costs (bytes read, decoded and copied per emitted row) improve
      # by shrinking, and the action fixes one direction per suite, so they are
      # their own smaller-is-better suite on the same dashboard. A cost that was
      # zero and becomes nonzero alerts: the action divides by the previous
      # value and treats 0/0 as unchanged. Bytes are counted by the engine,
      # not timed, so the costs stay one series across hosts, one per line.
      - name: Store benchmark costs
        if: ${{ !cancelled() && steps.dbbench.outcome == 'success' && steps.bot-token.outputs.token != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: "lsm-tree db_bench costs ${{ steps.line.outputs.major }}.x"
          tool: customSmallerIsBetter
          output-file-path: benchmark-costs.json
          github-token: ${{ steps.bot-token.outputs.token }}
          # Looked up by SHA, as in the rate store above.
          ref: ${{ github.sha }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          alert-comment-cc-users: "@polaz"
          alert-threshold: "115%"
          fail-on-alert: false
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          benchmark-data-dir-path: dev/bench

      # As after the rate store: the cost store leaves a local gh-pages commit
      # on a run that does not auto-push.
      - name: Drop the local gh-pages the cost store left
        if: ${{ !cancelled() && steps.dbbench.outcome == 'success' && steps.bot-token.outputs.token != '' }}
        run: git branch --delete --force gh-pages 2>/dev/null || true

      # Times measured on this host that improve by shrinking, such as a scan's
      # time to its first batch: smaller is better like the costs, but one
      # series per host like the rates, since a time measured on one machine
      # is no baseline for another.
      - name: Store benchmark timings
        if: ${{ !cancelled() && steps.dbbench.outcome == 'success' && steps.bot-token.outputs.token != '' }}
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: "lsm-tree db_bench timings ${{ steps.line.outputs.major }}.x · ${{ runner.os }} · ${{ runner.name }}"
          tool: customSmallerIsBetter
          output-file-path: benchmark-timings.json
          github-token: ${{ steps.bot-token.outputs.token }}
          # Looked up by SHA, as in the rate store above.
          ref: ${{ github.sha }}
          auto-push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          comment-on-alert: true
          alert-comment-cc-users: "@polaz"
          alert-threshold: "115%"
          fail-on-alert: false
          save-data-file: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          benchmark-data-dir-path: dev/bench

      # The dashboard page (.github/bench/dashboard.html, which reads the
      # data.js beside it): branch and runner selectors defaulting to whatever
      # was measured last, charts grouped by what they measure, two columns.
      # It replaces the store action's own index.html, which the action only
      # writes when none exists, and keeps the old overlay.html address
      # working. It depends on the db_bench pass only, so a host that cannot
      # build RocksDB still publishes it.
      - name: Publish the dashboard page to gh-pages
        if: >
          !cancelled() &&
          steps.dbbench.outcome == 'success' &&
          steps.bot-token.outputs.token != '' &&
          github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          push_gh_pages="$PWD/.github/scripts/push-gh-pages.sh"
          work="$(mktemp -d "${TMPDIR:-/tmp}/overlay-ghpages.XXXXXXXX")"
          trap 'rm -rf "$work"' EXIT
          # The token reaches git through a credential helper reading the
          # environment, never argv or .git/config (see the compare publish
          # step below for the reasoning).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          # shellcheck disable=SC2016
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git clone --depth 1 --branch gh-pages \
            "https://github.com/${REPO}.git" "$work"
          mkdir -p "$work/dev/bench"
          cp .github/bench/dashboard.html "$work/dev/bench/index.html"
          cp .github/bench/dashboard.html "$work/dev/bench/overlay.html"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev/bench/index.html dev/bench/overlay.html
          if git diff --cached --quiet; then
            echo "::notice::dashboard page unchanged"
          else
            git commit -m "bench: refresh the dashboard page (dev/bench)"
            bash "$push_gh_pages"
          fi

      # Publish the head-to-head under dev/compare, alongside the db_bench
      # dashboard at dev/bench: the page (.github/bench/compare.html), the
      # harness's summary.json it draws from, and a meta.json naming what was
      # measured. Manual git push (rather than a third-party publish action)
      # keeps the workflow's "every `uses:` pinned to a SHA" hardening policy
      # intact, with the App-scoped token the stores use.
      - name: Publish the compare-rocksdb page to gh-pages
        # Publish on main pushes AND on manual workflow_dispatch. The overlay is
        # a ratio SNAPSHOT (dev/compare is replaced wholesale each run), not the
        # per-commit trend that dev/bench is — so a manual dispatch refreshing it
        # can't contaminate any time series. This lets a maintainer populate the
        # overlays on demand (e.g. right after a runner fix) without waiting for
        # the next merge to main. The db_bench trend (benchmark-action auto-push /
        # save-data above) stays push+main only.
        if: >
          !cancelled() &&
          steps.compare.outcome == 'success' &&
          steps.bot-token.outputs.token != '' &&
          (
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch'
          )
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}
          REPO: ${{ github.repository }}
          LINE_MAJOR: ${{ steps.line.outputs.major }}
          MEASURED_REF: ${{ github.ref_name }}
          MEASURED_SHA: ${{ github.sha }}
          MEASURED_RUNNER: ${{ runner.name }}
        run: |
          set -euo pipefail
          summary="tools/compare-rocksdb/target/head-to-head/summary.json"
          if [ ! -f "$summary" ]; then
            echo "::error::the harness wrote no summary at $summary"
            exit 1
          fi
          # Explicit template (not bare `mktemp -d`, which is GNU-only and
          # fails on macOS/BSD with "too few X's") so the step survives a
          # future runner-OS change.
          push_gh_pages="$PWD/.github/scripts/push-gh-pages.sh"
          work="$(mktemp -d "${TMPDIR:-/tmp}/compare-ghpages.XXXXXXXX")"
          # Remove the temp clone on every exit path (success, error, or
          # cancellation) so it doesn't leak disk on a long-lived
          # self-hosted runner.
          trap 'rm -rf "$work"' EXIT
          # Supply the token through a credential helper that reads it from
          # the environment at call time, so it appears neither in argv
          # (visible via `ps` on a shared self-hosted host) nor in a
          # persisted remote URL / .git/config. The clone + push both use a
          # plain, secret-free https URL; GIT_CONFIG_* injects the helper
          # into every git invocation in this step's environment.
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=credential.helper
          # SC2016: the single quotes are deliberate — `${GH_TOKEN}` must NOT
          # expand here. It is expanded later by the helper's own shell when
          # git invokes it, reading the token from the (exported) environment
          # so it never lands in argv or config.
          # shellcheck disable=SC2016
          export GIT_CONFIG_VALUE_0='!f() { echo username=x-access-token; echo "password=${GH_TOKEN}"; }; f'
          git clone --depth 1 --branch gh-pages \
            "https://github.com/${REPO}.git" "$work"
          # Replace the previous snapshot wholesale, so a group the harness no
          # longer runs leaves nothing behind (the per-benchmark report trees
          # earlier runs published go with it); dev/bench and every other
          # gh-pages path are untouched.
          rm -rf "$work/dev/compare"
          mkdir -p "$work/dev/compare"
          cp .github/bench/compare.html "$work/dev/compare/index.html"
          cp "$summary" "$work/dev/compare/summary.json"
          # The page is a snapshot replaced on every run, so it names the line,
          # branch, commit and runner it measured. A branch name may hold `"`
          # and `\` (git check-ref-format allows them), so it is escaped for
          # JSON with shell built-ins only: the Git for Windows shell may ship
          # no sed.
          ref_json=""
          rest="$MEASURED_REF"
          while [ -n "$rest" ]; do
            c="${rest%"${rest#?}"}"
            rest="${rest#?}"
            case "$c" in
              \\) ref_json="$ref_json\\\\" ;;
              '"') ref_json="$ref_json\\\"" ;;
              *) ref_json="$ref_json$c" ;;
            esac
          done
          printf '{"line":"%s","ref":"%s","sha":"%s","repo":"%s","runner":"%s"}\n' \
            "$LINE_MAJOR" "$ref_json" "$MEASURED_SHA" "$REPO" "$MEASURED_RUNNER" \
            > "$work/dev/compare/meta.json"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dev/compare
          if git diff --cached --quiet; then
            echo "::notice::compare-rocksdb page unchanged, nothing to publish"
          else
            git commit -m "bench: refresh the compare-rocksdb page (dev/compare)"
            bash "$push_gh_pages"
            echo "::notice::published the compare-rocksdb page to dev/compare/"
          fi

      # The workspace of a self-hosted runner survives the job, and the next
      # checkout only clears it when the next run starts, so the engine's and
      # db_bench's build would sit on the host's disk in between. Removed
      # whatever the job's outcome. tools/compare-rocksdb/target stays: the
      # next checkout's clean removes it, and the cache already holds it.
      - name: Remove this run's build output
        if: always()
        run: |
          cargo clean
          cargo clean --manifest-path tools/db_bench/Cargo.toml
