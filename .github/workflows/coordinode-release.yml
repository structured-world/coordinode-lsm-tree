name: Release

# Runs on the maintained `<major>.x.x` release lines; main carries its own copy
# of this workflow. release-plz opens the release PR against the branch it runs
# on, and with a newer major already tagged it still bumps within this line
# (5.11.1 -> 5.11.2) and writes the changelog from this line's commits only.
# The release PR branch prefix is set per line in .release-plz.toml, so this
# line's release PR and main's never close or overwrite each other.
on:
  push:
    branches:
      - "*.x.x"

# One release-plz run per branch at a time: two pushes in quick succession
# would otherwise race on the same release PR branch.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    runs-on: ubuntu-latest
    steps:
      # Pinning policy: first-party actions (actions/*, dependabot/*) track a
      # MAJOR tag. GitHub owns both the org and the runner these steps execute
      # on, so a commit digest buys no protection a tag does not, while costing
      # a dependency bump per patch release. Third-party actions stay pinned to
      # a digest with a version comment - that is where the supply-chain risk
      # actually is. Applies to this privileged workflow too.
      - name: Generate token (SW Release Bot)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          # Least-privilege scope: release-plz needs to push version-bump
          # commits + release-PR branches (contents:write), open the
          # release PR (pull-requests:write), and create GitHub Releases
          # (releases is part of contents:write).
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # persist-credentials: false — release-plz reads the token via
          # the explicit GITHUB_TOKEN env var on its own steps, NOT via
          # .git/config. Disabling default credential persistence closes
          # the credential-persistence attack surface (zizmor's
          # `artipacked` lint — token leakage via the .git/config that
          # the default checkout would have populated with the
          # GITHUB_TOKEN, then exfiltrated by any later
          # actions/upload-artifact step).
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable

      # Step 1: Create or update this line's release PR (version bump + changelog)
      - name: Create release PR
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5  # v0.5.139
        with:
          command: release-pr
          config: .release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Step 2: If version in Cargo.toml > latest tag, create GitHub Release + tag
      # This triggers release.yml → cargo publish via OIDC
      - name: Create GitHub Release
        uses: release-plz/action@b8d6b54b02889ff2ae2bb82e8b57c3a8fc1683a5  # v0.5.139
        with:
          command: release
          config: .release-plz.toml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Step 3: The "Latest release" mark belongs to the highest version. This
      # line's releases are the highest until a newer major ships from main,
      # and must not take the mark after that; release-plz only has a static
      # switch (`git_release_latest`, off here), so the mark is placed here
      # instead. Re-checked on every run, so it also catches up on releases
      # an earlier run published.
      #
      # Main's release workflow can publish a newer major while this step
      # runs, and marks it latest as it creates it. After moving the mark,
      # the step reads the releases again and repeats until the mark sits on
      # the highest one, so a version it picked before that release appeared
      # does not keep the mark: whichever happens last, the mark ends on the
      # highest version.
      - name: Mark the highest release as latest
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            # Filtered in jq, so no matching release is an empty result, not a
            # failed command.
            tags=$(gh release list --repo "$REPO" --exclude-drafts --exclude-pre-releases \
              --limit 1000 --json tagName \
              --jq '.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))')
            highest=$(printf '%s\n' "$tags" | sort -V | tail -n 1)
            if [ -z "$highest" ]; then
              echo "no published release"
              exit 0
            fi
            current=$(gh release view --repo "$REPO" --json tagName --jq '.tagName' || true)
            if [ "$current" = "$highest" ]; then
              echo "$highest is the latest release"
              exit 0
            fi
            echo "attempt $attempt: latest release ${current:-none} -> $highest"
            gh release edit "$highest" --repo "$REPO" --latest
          done
          echo "::error::the latest release mark did not settle on the highest version"
          exit 1
