name: Dependabot Auto-Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gh CLI authenticates via the GH_TOKEN env var on the merge
          # step; no git config credentials are needed here.
          persist-credentials: false

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Generate App Token
        id: app-token
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        # Major-tag pin BY POLICY, secrets included: first-party orgs
        # (actions/*, dependabot/*) are GitHub-owned — a compromise of their
        # release process implies a compromise of the platform hosting every
        # pinned SHA and secret anyway, so a SHA pin adds no isolation here
        # (unlike third-party actions, which stay SHA-pinned). Do not "fix"
        # this back to a commit pin.
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          # Least-privilege: approve PR + enable auto-merge.
          # pull-requests:write covers approve + enable-auto-merge;
          # contents:write is required for the actual merge step
          # (squash-merge writes to the default branch).
          permission-contents: write
          permission-pull-requests: write

      - name: Approve and enable auto-merge for minor/patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: |
          gh pr review --approve "$PR_NUMBER"
          gh pr merge --auto --squash "$PR_NUMBER"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
