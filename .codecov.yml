coverage:
  status:
    patch:
      default:
        # A fixed bar instead of the default "auto" (auto compares the patch
        # against the project's overall coverage, ~92%). Storage-recovery and
        # verification code is dominated by defensive error-classification
        # arms — Display impls, double-fault plumbing (an I/O error while
        # handling another error), exotic-corruption classifiers — whose value
        # is that the classification exists and fails closed, a contract the
        # representative refuse/abort tests already pin. Demanding a dedicated
        # test per format! wrapper adds fixtures, not confidence; the fixed
        # target keeps the gate strict for genuinely untested behaviour.
        target: 80%
        threshold: 1%

# Paths excluded from both patch and project coverage.
ignore:
  # structured-zstd bundles its pure-Rust implementation under src/.
  # llvm-cov captures those files; exclude them so only workspace sources
  # count toward patch and project coverage.
  - "zstd/**"
  # Vendored byteview slice backend (in-tree copy of an upstream crate, kept
  # faithful for future extraction). It ships its own test suite; exclude it
  # so vendored lines do not count toward patch and project coverage.
  - "src/byteview/**"
  # Heal fuzzer harness. It is exercised by the dedicated fuzz-heal CI job
  # (ignored-only, no coverage instrumentation), and its assertions run there
  # on every push; unit tests over the harness itself would test the test.
  - "src/fuzz_heal.rs"
